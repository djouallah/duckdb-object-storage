name: stress

# POC: OneLake stress test, manual only (Run workflow). Racing writers, random kill -9, readers
# during writes, a >1 GiB sync: see the header of test/azure/stress.sh.
# Same OIDC app and workspace as onelake.yml.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: true

env:
  ONELAKE_WORKSPACE: mimtest
  ONELAKE_LAKEHOUSE: duckdb_objfs.Lakehouse
  ONELAKE_ROOT: duckdb_objfs.Lakehouse/Files/duckdb_objfs

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GEN: ninja
      # Shallow submodules carry no tags; pin the version so INSTALL azure resolves.
      OVERRIDE_GIT_DESCRIBE: v1.5.6
    steps:
      - uses: actions/checkout@v4
      # Same key as onelake.yml, so the binary it cached is reused.
      - name: Build cache key
        id: key
        run: |
          echo "submodules=$(git ls-tree HEAD duckdb extension-ci-tools | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore duckdb binary
        id: build-cache
        uses: actions/cache@v4
        with:
          path: build/release/duckdb
          key: duckdb-release-${{ steps.key.outputs.submodules }}-${{ hashFiles('src/**', 'rust/src/**', 'rust/include/**', 'rust/Cargo.toml', 'rust/build.rs', 'rust/proto/**', 'CMakeLists.txt', 'extension_config.cmake', 'Makefile', 'test/sql/**') }}
      - name: Checkout submodules
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --recursive --depth 1
      - uses: dtolnay/rust-toolchain@stable
        if: steps.build-cache.outputs.cache-hit != 'true'
      - name: Install build tools
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: hendrikmuhs/ccache-action@v1.2
        if: steps.build-cache.outputs.cache-hit != 'true'
        with:
          key: extension
      - name: Build (release)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: make release
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Mint OneLake token
        run: |
          token=$(az account get-access-token --resource https://storage.azure.com --query accessToken -o tsv)
          echo "::add-mask::${token}"
          echo "ONELAKE_TOKEN=${token}" >> "$GITHUB_ENV"
      - name: OneLake stress (test/azure/stress.sh)
        timeout-minutes: 80
        env:
          STRESS_WORK_DIR: ${{ runner.temp }}/stress
        run: bash test/azure/stress.sh
      - name: Upload stress logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-logs
          path: ${{ runner.temp }}/stress
          if-no-files-found: ignore
