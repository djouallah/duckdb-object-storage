name: stress

# POC, manual only: OneLake stress test with the duckdb binary from a build.yml run. Racing writers,
# random kill -9, readers during writes, a >1 GiB sync: see the header of test/azure/stress.sh.
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'build run whose duckdb artifact to use (default: latest successful build on the branch)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: true

env:
  ONELAKE_WORKSPACE: mimtest
  ONELAKE_LAKEHOUSE: duckdb_objfs.Lakehouse
  ONELAKE_ROOT: duckdb_objfs.Lakehouse/Files/duckdb_objfs

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      # The binary comes from a build run: the one given, or the latest successful one on this branch.
      - name: Pick build run
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.build_run_id }}
        run: |
          if [ -z "${RUN_ID}" ]; then
            RUN_ID=$(gh run list -R "$GITHUB_REPOSITORY" -w build --branch "$GITHUB_REF_NAME" --status success -L 1 \
              --json databaseId --jq '.[0].databaseId')
          fi
          [ -n "${RUN_ID}" ] || { echo "no successful build run on ${GITHUB_REF_NAME}" >&2; exit 1; }
          sha=$(gh run view "${RUN_ID}" -R "$GITHUB_REPOSITORY" --json headSha --jq .headSha)
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "duckdb binary from build run [${RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}) at \`${sha:0:7}\`" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        with:
          name: duckdb
          path: build/release
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
      # Artifacts do not keep the executable bit.
      - run: chmod +x build/release/duckdb
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Mint OneLake token
        run: |
          token=$(az account get-access-token --resource https://storage.azure.com --query accessToken -o tsv)
          echo "::add-mask::${token}"
          echo "ONELAKE_TOKEN=${token}" >> "$GITHUB_ENV"
      - name: OneLake stress (test/azure/stress.sh)
        timeout-minutes: 80
        env:
          STRESS_WORK_DIR: ${{ runner.temp }}/stress
        run: bash test/azure/stress.sh
      - name: Upload stress logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-logs
          path: ${{ runner.temp }}/stress
          if-no-files-found: ignore
