name: onelake

# POC: the azure (OneLake) backend, verified against live OneLake.
# Auth is OIDC with the fabric-github-deploy app; it needs Contributor on the target workspace.
on:
  push:
    branches: [onelake-azblob]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: onelake-${{ github.ref }}
  cancel-in-progress: true

env:
  ONELAKE_WORKSPACE: mimtest
  # Schema-enabled lakehouse created for this POC. One database, reused by every run, never deleted.
  ONELAKE_LAKEHOUSE: duckdb_objfs.Lakehouse
  ONELAKE_ROOT: duckdb_objfs.Lakehouse/Files/duckdb_objfs
  DUCKLAKE_SCHEMA: ducklake_test

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Resolve Cargo.lock
        run: cargo metadata --format-version 1 --manifest-path rust/Cargo.toml > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: rust/Cargo.lock
      - name: fmt (report only)
        continue-on-error: true
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --manifest-path rust/Cargo.toml

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GEN: ninja
      # Shallow submodules carry no tags; pin the version so INSTALL azure resolves.
      OVERRIDE_GIT_DESCRIBE: v1.5.6
    steps:
      - uses: actions/checkout@v4
      # The build only depends on the extension sources and the submodule commits, so a change to
      # the e2e script reuses the previous duckdb binary instead of recompiling DuckDB.
      - name: Build cache key
        id: key
        run: |
          echo "submodules=$(git ls-tree HEAD duckdb extension-ci-tools | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore duckdb binary
        id: build-cache
        uses: actions/cache@v4
        with:
          path: build/release/duckdb
          key: duckdb-release-${{ steps.key.outputs.submodules }}-${{ hashFiles('src/**', 'rust/src/**', 'rust/include/**', 'rust/Cargo.toml', 'rust/build.rs', 'rust/proto/**', 'CMakeLists.txt', 'extension_config.cmake', 'Makefile', 'test/sql/**') }}
      - name: Checkout submodules
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --recursive --depth 1
      - uses: dtolnay/rust-toolchain@stable
        if: steps.build-cache.outputs.cache-hit != 'true'
      - name: Install build tools
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: hendrikmuhs/ccache-action@v1.2
        if: steps.build-cache.outputs.cache-hit != 'true'
        with:
          key: ${{ github.job }}
      - name: Build (release)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: make release
      - name: Extension sqllogictests (local/memory backends)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: make test_release
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Mint OneLake token
        run: |
          token=$(az account get-access-token --resource https://storage.azure.com --query accessToken -o tsv)
          echo "::add-mask::${token}"
          echo "ONELAKE_TOKEN=${token}" >> "$GITHUB_ENV"
      - name: OneLake e2e
        run: bash test/azure/run_e2e.sh
      - name: DuckLake on OneLake (test/azure/test.sql)
        if: always() && env.ONELAKE_TOKEN != ''
        run: |
          set -o pipefail
          status=0
          CURL_CA_INFO=/etc/ssl/certs/ca-certificates.crt build/release/duckdb -bail -f test/azure/test.sql 2>&1 | tee ducklake.log || status=$?
          {
            echo "## DuckLake on OneLake (test/azure/test.sql)"
            [ -s ducklake_checks.md ] && cat ducklake_checks.md
            if [ $status -ne 0 ]; then echo '```'; grep -a -i error ducklake.log | tail -n 5; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
