name: onelake

# POC: the azure (OneLake) backend, verified against live OneLake.
# Auth is OIDC with the fabric-github-deploy app; it needs Contributor on the target workspace.
on:
  push:
    branches: [onelake-azblob]
  workflow_dispatch:
    inputs:
      cleanup:
        description: Delete this run's OneLake data at the end
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: onelake-${{ github.ref }}
  cancel-in-progress: true

env:
  ONELAKE_WORKSPACE: mimtest
  # Schema-enabled lakehouse created for this POC.
  ONELAKE_LAKEHOUSE: duckdb_objfs.Lakehouse

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ONELAKE_ROOT: duckdb_objfs.Lakehouse/Files/duckdb_objfs_ci/${{ github.run_id }}-${{ github.run_attempt }}-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Resolve Cargo.lock
        run: cargo metadata --format-version 1 --manifest-path rust/Cargo.toml > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: rust/Cargo.lock
      - name: fmt (report only)
        continue-on-error: true
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Mint OneLake token
        run: |
          token=$(az account get-access-token --resource https://storage.azure.com --query accessToken -o tsv)
          echo "::add-mask::${token}"
          echo "ONELAKE_TOKEN=${token}" >> "$GITHUB_ENV"
      - name: cargo test (includes live OneLake round trip)
        run: cargo test --manifest-path rust/Cargo.toml -- --nocapture
      - name: Clean up OneLake
        if: always() && env.ONELAKE_TOKEN != '' && inputs.cleanup != false
        run: |
          curl -s -o /dev/null -w "cleanup ${ONELAKE_ROOT}: %{http_code}\n" -X DELETE \
            -H "Authorization: Bearer ${ONELAKE_TOKEN}" -H "x-ms-version: 2023-11-03" \
            "https://onelake.dfs.fabric.microsoft.com/${ONELAKE_WORKSPACE}/${ONELAKE_ROOT}?recursive=true"

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ONELAKE_ROOT: duckdb_objfs.Lakehouse/Files/duckdb_objfs_ci/${{ github.run_id }}-${{ github.run_attempt }}-ext
      # DuckLake tables land in Tables/<schema>/; one schema per run.
      DUCKLAKE_SCHEMA: ci_${{ github.run_id }}_${{ github.run_attempt }}
      GEN: ninja
      # Shallow submodules carry no tags; pin the version so INSTALL azure resolves.
      OVERRIDE_GIT_DESCRIBE: v1.5.6
    steps:
      - uses: actions/checkout@v4
      # The build only depends on the extension sources and the submodule commits, so a change to
      # the e2e script reuses the previous duckdb binary instead of recompiling DuckDB.
      - name: Build cache key
        id: key
        run: |
          echo "submodules=$(git ls-tree HEAD duckdb extension-ci-tools | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore duckdb binary
        id: build-cache
        uses: actions/cache@v4
        with:
          path: build/release/duckdb
          key: duckdb-release-${{ steps.key.outputs.submodules }}-${{ hashFiles('src/**', 'rust/src/**', 'rust/include/**', 'rust/Cargo.toml', 'rust/build.rs', 'rust/proto/**', 'CMakeLists.txt', 'extension_config.cmake', 'Makefile', 'test/sql/**') }}
      - name: Checkout submodules
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --recursive --depth 1
      - uses: dtolnay/rust-toolchain@stable
        if: steps.build-cache.outputs.cache-hit != 'true'
      - name: Install build tools
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: hendrikmuhs/ccache-action@v1.2
        if: steps.build-cache.outputs.cache-hit != 'true'
        with:
          key: ${{ github.job }}
      - name: Build (release)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: make release
      - name: Extension sqllogictests (local/memory backends)
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: make test_release
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Mint OneLake token
        run: |
          token=$(az account get-access-token --resource https://storage.azure.com --query accessToken -o tsv)
          echo "::add-mask::${token}"
          echo "ONELAKE_TOKEN=${token}" >> "$GITHUB_ENV"
      - name: OneLake e2e
        run: bash test/azure/run_e2e.sh
      - name: Clean up OneLake
        if: always() && env.ONELAKE_TOKEN != '' && inputs.cleanup != false
        run: |
          for path in "${ONELAKE_ROOT}" "${ONELAKE_LAKEHOUSE}/Tables/${DUCKLAKE_SCHEMA}"; do
            curl -s -o /dev/null -w "cleanup ${path}: %{http_code}\n" -X DELETE \
              -H "Authorization: Bearer ${ONELAKE_TOKEN}" -H "x-ms-version: 2023-11-03" \
              "https://onelake.dfs.fabric.microsoft.com/${ONELAKE_WORKSPACE}/${path}?recursive=true"
          done
